# WordCraft (Baell) — Android CI.
#
# Builds the Android port on GitHub's servers; no local toolchain needed.
#
# - Every push: check the Android crate (cargo check/clippy for an Android target, no linking)
#   and build debug APKs, uploaded as workflow artifacts.
# - A tag matching `v*-android*` (say `v0.18.1-android.1`) additionally builds signed release
#   APKs and an AAB for all ABIs and publishes them on a GitHub release.
#
# Local equivalent: docs/BUILD.md. Signing: the release job requires the repository secrets
# ANDROID_KEYSTORE_B64 (base64 of a .jks/.keystore), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, and refuses to publish a build signed with a
# throwaway key. Generate them once with packaging/android/generate-signing-key.ps1.

name: Android (Baell)

on:
  push:
    branches: [main, master]
    tags: ['v*-android*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.0.12077973

jobs:
  # The Android crate, compiled for an Android target without linking. The NDK is still set
  # up: `android-activity`'s build script compiles its C glue for the target, which needs the
  # NDK's clang even for `cargo check`.
  check-android:
    name: Check Android target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v4

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust (stable) with the Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: baell-android-check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check (aarch64-linux-android)
        run: cargo check -p wordcraft-android --target aarch64-linux-android

      - name: Clippy (aarch64-linux-android)
        run: cargo clippy -p wordcraft-android --target aarch64-linux-android -- -D warnings

  # Build the native library for all ABIs and package it. With ABI splits one Gradle run
  # yields an APK per ABI plus a universal one, so there is no build matrix.
  build:
    name: Build debug APKs
    needs: check-android
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v4

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust (stable) with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: baell-android-build

      # Run cargo from the workspace root, where [patch.crates-io] pins egui, eframe and winit
      # to the WordCraft forks. cargo-ndk writes each ABI's library straight into the folder
      # Gradle packages.
      - name: Build libwordcraft_android.so for all ABIs
        run: >
          cargo ndk
          -t arm64-v8a
          -t armeabi-v7a
          -t x86_64
          -o android/app/src/main/jniLibs
          -- build --release -p wordcraft-android

      - name: Build debug APKs
        working-directory: android
        run: gradle :app:assembleDebug --console=plain

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: baell-wordcraft-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Release: on a `v*-android*` tag, build signed release APKs and an AAB and publish them.
  release:
    name: Release APKs and AAB
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag is the one source of truth for the release identity. versionCode must strictly
      # increase for every release: Android refuses to install an update whose versionCode is not
      # higher than the installed one. The build number (the `.1` in v0.18.1-android.1) is part
      # of the code, so v0.18.1-android.2 is still an update over v0.18.1-android.1.
      - name: Derive the version from the tag
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          if [[ ! "$ref" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-android(\.([0-9]+))?$ ]]; then
            echo "::error::Tag '$ref' must look like v<major>.<minor>.<patch>-android[.<build>] (for example v0.18.1-android.1)."
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          build=$((10#${BASH_REMATCH[5]:-1}))
          if (( minor > 99 || patch > 99 || build > 99 )); then
            echo "::error::versionCode needs minor, patch and build below 100 (got $minor.$patch.$build)."
            exit 1
          fi
          version_name="${ref#v}"
          version_code=$(( major * 1000000 + minor * 10000 + patch * 100 + build ))
          echo "BAELL_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "BAELL_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Release $version_name (versionCode $version_code)"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v4

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust (stable) with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: baell-android-release

      - name: Build libwordcraft_android.so for all ABIs
        run: >
          cargo ndk
          -t arm64-v8a
          -t armeabi-v7a
          -t x86_64
          -o android/app/src/main/jniLibs
          -- build --release -p wordcraft-android

      # A real release carries a stable signing identity: the same key every time, so Android
      # installs the next version over the previous one. A throwaway key generated on the runner
      # would make every update require an uninstall, so this job refuses to publish without the
      # secrets (docs/BUILD.md). The key never leaves the runner (secrets and temporary files only).
      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=("ANDROID_KEYSTORE_B64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Release signing secrets are missing: ${missing[*]}. Add all four under Settings > Secrets and variables > Actions (docs/BUILD.md); a release is never published with a throwaway key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/baell.keystore"
          echo "SIGNING_STORE=$RUNNER_TEMP/baell.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APKs and AAB
        working-directory: android
        run: >
          gradle :app:assembleRelease :app:bundleRelease --console=plain
          -Pandroid.injected.signing.store.file=$SIGNING_STORE
          -Pandroid.injected.signing.store.password=$SIGNING_STORE_PASSWORD
          -Pandroid.injected.signing.key.alias=$SIGNING_KEY_ALIAS
          -Pandroid.injected.signing.key.password=$SIGNING_KEY_PASSWORD

      # Prove the artifacts carry the expected signature instead of trusting Gradle's log.
      - name: Verify the APK signatures
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          for apk in android/app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Collect and checksum the outputs
        run: |
          mkdir -p release
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "release/WordCraft-Baell-${GITHUB_REF_NAME}-${abi}.apk"
          done
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "release/WordCraft-Baell-${GITHUB_REF_NAME}.aab"
          sha256sum release/* > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: WordCraft (Baell) ${{ github.ref_name }} for Android
          body: |
            Android build of [WordCraft](https://github.com/storytold/wordcraft), the open-source Rust word processor — the Baell port.

            - `WordCraft-Baell-${{ github.ref_name }}-arm64-v8a.apk` — modern phones (install this one)
            - `WordCraft-Baell-${{ github.ref_name }}-armeabi-v7a.apk` — older 32-bit phones
            - `WordCraft-Baell-${{ github.ref_name }}-universal.apk` — every ABI in one file
            - `WordCraft-Baell-${{ github.ref_name }}.aab` — for Play Store upload or `bundletool`
            - `SHA256SUMS.txt` — checksums of all files

            Install with `adb install <apk>` or by opening the APK on the phone. Package: `ai.baell.word`.
          files: |
            release/WordCraft-Baell-${{ github.ref_name }}-*.apk
            release/WordCraft-Baell-${{ github.ref_name }}.aab
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
